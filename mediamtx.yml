# MediaMTX config for the mobile clinic camera relay.
# Full reference: https://github.com/bluenviron/mediamtx/blob/main/mediamtx.yml

webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []

rtspAddress: :8554

paths:
  cam1:
    # PROTOTYPE MODE (current): no source set below, so this path accepts
    # a stream pushed in from a browser via WHIP (see web/publish-test.html).
    # That lets us test the full pipeline before the real NVR is wired up.
    #
    # REAL CAMERA MODE: once we have the NVR's RTSP URL, comment out the
    # "PROTOTYPE MODE" state above (nothing to change, source is just absent)
    # and add the line below instead:
    # source: rtsp://<user>:<password>@<nvr-ip>:554/<stream-path>
    sourceOnDemand: no
